  amd64-rootfs:
    plugin: dump
    source: https://github.com/MitchellAugustin/steam-snap/releases/download/amd64-components-9-2-26/amd64_rootfs.tar.gz
    organize:
        amd64_rootfs: .
  fex-emu:
    plugin: nil
    stage-packages:
      - fex-emu-armv8.0
      - fex-emu-wine
      - zenity
  fex-config:
    plugin: dump
    source: ./fex_config
  wget:
    plugin: nil
    stage-packages:
      - wget
  desktop-launch:
    plugin: dump
    source: ./src/
    organize:
        desktop-launch: bin/
    stage:
      - bin/desktop-launch
  steam-devices:
    plugin: dump
    source: https://github.com/ValveSoftware/steam-devices.git
  steam:
    plugin: nil
    build-packages:
      - dpkg-dev
      - dirmngr # Needed for launchpad builds
    build-snaps:
      - core26
    stage-packages:
      - libappindicator3-1
      - libxcb-dri3-0
