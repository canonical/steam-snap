      - libaom3
      - libavcodec60
      - libavutil58
      - libdav1d7
      - libswscale7
      - libvpx9
    prime:
      - -usr/include
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/bug
      - -usr/share/gdb
      - -usr/share/emacs*
      - -usr/share/lintian
      - -usr/share/drirc.d
      - -usr/share/vulkan
      - -usr/share/Xsession.d
      - -usr/lib/*/dri
      - -usr/lib/*/vdpau
      - -usr/lib/*/libvkd3d*
      - -usr/lib/*/libvulkan*
      - -usr/lib/*/libVk*
      - -usr/lib/*/libLLVM*
      - -usr/lib/*/libgallium* # provided by gaming-graphics-core26
      - -usr/lib/*/libasound.so* # conflicts with alsa-mixin
    override-prime: |
      set -eux
      craftctl default
      cp -a /snap/core26/current/usr/lib/aarch64-linux-gnu/* usr/lib/aarch64-linux-gnu/
      # snap pack rejects non-world-readable meta dirs; pre-create them 0755 so the
      # pack step's mkdir(exist_ok=True) can't leave them at the builder's umask.
      install -d -m 755 meta meta/gui meta/hooks

  
